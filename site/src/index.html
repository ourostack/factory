<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The factory · the loom</title>
<meta name="description" content="Every agent session woven from its published record: what it spent its time on, what was reviewed about it, and what could change next." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23f6f0e5'/%3E%3Cpath d='M6 10h28M6 17h28M6 24h28M6 31h28' stroke='%2334489a' stroke-width='3'/%3E%3Cpath d='M10 6v28M17 6v28M24 6v28M31 6v28' stroke='%23a8402c' stroke-width='3' stroke-dasharray='4 3'/%3E%3C/svg%3E" />
<link rel="alternate" type="text/plain" href="llms.txt" title="Index of the data files, for agents" />
<link rel="stylesheet" href="loom.css" />
<!-- The start-up states work even when loom.css or a script fails to load. -->
<style>
  .loom-boot { max-width: 40rem; margin: 3rem auto; padding: 0 1.25rem; font: 17px/1.55 Georgia, serif; }
  .loom-boot-failed { display: none; }
  [data-loom-asset="failed"] .loom-boot-failed { display: block; }
  [data-loom-asset="failed"] .loom-boot-pending { display: none; }
</style>
</head>
<body>
<!-- Shared paint. Bare canvas means "no captured interval", never zero. -->
<svg class="loom-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="loom-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" class="hatch-bg" />
      <line x1="0" y1="0" x2="0" y2="6" class="hatch-line" />
    </pattern>
    <pattern id="loom-weft" width="6" height="8" patternUnits="userSpaceOnUse">
      <rect width="3" height="4" class="weft-a" />
      <rect x="3" y="4" width="3" height="4" class="weft-a" />
      <rect x="3" width="3" height="4" class="weft-b" />
      <rect y="4" width="3" height="4" class="weft-b" />
    </pattern>
  </defs>
</svg>
<div id="loom">
  <div class="loom-boot">
    <p class="loom-boot-pending" role="status">Loading the loom… If this stays, open <a href="evidence.html">the detailed evidence reader</a>.</p>
    <div class="loom-boot-failed" role="alert">
      <p>The loom’s scripts couldn’t load, so nothing here has been read from the session records.</p>
      <p><button type="button" onclick="location.reload()">Try again</button> or open <a href="evidence.html">the detailed evidence reader</a> or <a href="llms.txt">the data index</a>.</p>
    </div>
  </div>
  <noscript><p class="noscript">The loom needs JavaScript to read the session records. <a href="evidence.html">The detailed evidence reader</a> and <a href="llms.txt">the data index</a> are available.</p></noscript>
</div>
<script src="task-context.js" onerror="document.documentElement.setAttribute('data-loom-asset', 'failed')"></script>
<script src="session-data.js" onerror="document.documentElement.setAttribute('data-loom-asset', 'failed')"></script>
<script src="format.js" onerror="document.documentElement.setAttribute('data-loom-asset', 'failed')"></script>
<script src="learning.js" onerror="document.documentElement.setAttribute('data-loom-asset', 'failed')"></script>
<script src="loom.js" onerror="document.documentElement.setAttribute('data-loom-asset', 'failed')"></script>
</body>
</html>
