<body>
<!-- Shared paint. Bare canvas means "no captured interval", never zero. -->
<svg class="loom-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="loom-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" class="hatch-bg" />
      <line x1="0" y1="0" x2="0" y2="6" class="hatch-line" />
    </pattern>
    <pattern id="loom-weft" width="6" height="8" patternUnits="userSpaceOnUse">
      <rect width="3" height="4" class="weft-a" />
      <rect x="3" y="4" width="3" height="4" class="weft-a" />
      <rect x="3" width="3" height="4" class="weft-b" />
      <rect y="4" width="3" height="4" class="weft-b" />
    </pattern>
  </defs>
</svg>
<div id="loom">
  <noscript><p class="noscript">The loom needs JavaScript to read the session records. <a href="evidence.html">The detailed evidence reader</a> and <a href="llms.txt">the data index</a> are available.</p></noscript>
</div>
