# Builds and publishes the public GitHub Pages site under site/.
#
# The site has no server and no build-time secrets: site/scripts/build-data.mjs
# reads the already-built `reports` branch (rollups/jobs factory-build just
# published) and the facts on `main`, makes a handful of unauthenticated,
# read-only calls to the public GitHub REST API (pull request merge state,
# kaizen/andon issues), and writes one data.json next to the static
# HTML/CSS/JS in site/src. It also publishes the reports branch's job and
# rollup JSON files beside the page, and llms.txt, the index agents read. The page itself fetches that data.json at runtime;
# nothing here talks to a database or holds a token beyond the ambient
# GITHUB_TOKEN used only to raise the GitHub API rate limit.
#
# Runs after factory-build finishes (so the reports branch it reads is
# current) and on demand. It does not run on every push to main, since
# main alone (without a fresh reports build) is not enough to render the
# job-level charts.
#
# Before building site data, `.github/scripts/apply-corrections.mjs`
# overlays `corrections/*.json` onto this checkout's own `facts/`, in place
# and never pushed, the same way `factory-build` does: the session-level
# reads in `site/scripts/build-data.mjs` (which reads `facts/` directly,
# not only the already-built reports) see corrected data on every run, no
# matter how many more times a stale client has republished since.
#
# This workflow does not run when factory-build failed: it would publish the
# site from a reports branch the build did not refresh. The site then keeps
# its last good deploy, and the "Built ..." stamp on it shows how old that
# is. factory-build opens the issue for that failure. If this workflow fails
# on its own, the `report` job opens or comments on one issue titled "Public
# site build needs attention" (label `build-failing`), and the next fully
# green run closes it. The issue names the failing step and the run URL only.
name: pages

on:
  workflow_run:
    workflows: [factory-build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check out reports
        uses: actions/checkout@v7
        with:
          ref: reports
          path: _reports
          fetch-depth: 1
          persist-credentials: false

      - name: Apply store corrections
        run: |
          set -euo pipefail
          node .github/scripts/apply-corrections.mjs --store . | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build site data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/dist
          node site/scripts/build-data.mjs --reports _reports --main . --out site/dist/data.json --pulls-out "$RUNNER_TEMP/pulls.json"
          cp site/src/index.html site/src/styles.css site/src/format.js site/src/walk.js site/src/steps.js site/src/app.js site/dist/
          echo "Site data built: $(wc -c < site/dist/data.json) bytes" | tee -a "$GITHUB_STEP_SUMMARY"

      # The task, session and rollup files the views load on demand, each
      # task's map file (map/<job>.json, derived here, with its pull
      # requests placed on the task clock from the GitHub reads the data
      # build left in the runner's temp folder), and
      # llms.txt, the index agents read. Whatever the reports branch holds is
      # published; a file the pipeline does not write yet is simply absent.
      - name: Publish data files
        run: |
          set -euo pipefail
          node site/scripts/publish-files.mjs --reports _reports --dist site/dist --template site/src/llms-template.txt --pulls "$RUNNER_TEMP/pulls.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: report
    needs: [build, deploy]
    if: ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.build.result != 'cancelled' && needs.deploy.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Only to read this run's step results and to open, comment on and close the one issue.
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Public site build needs attention
      ISSUE_LABEL: build-failing
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report the failed site build
        if: needs.build.result == 'failure' || needs.deploy.result == 'failure'
        continue-on-error: true
        run: |
          set -euo pipefail
          trap 'echo "::warning::The build alarm step failed; the build result is unchanged."' ERR
          steps="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[] | select(.conclusion == "failure") | .name as $job | .steps[] | select(.conclusion == "failure") | "\($job): \(.name)"] | join(", ")')"
          body="The public site build failed in $RUN_URL at: ${steps:-unknown step}. The site stays at its last good deploy until a run succeeds. Open the failed step in the run to see why; the next successful run closes this issue."
          gh label create "$ISSUE_LABEL" --repo "$GITHUB_REPOSITORY" --color B60205 --description "A factory build is failing" --force
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$ISSUE_LABEL" --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
          fi

      - name: Close the issue after a green deploy
        if: needs.build.result == 'success' && needs.deploy.result == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          trap 'echo "::warning::The build alarm step failed; the build result is unchanged."' ERR
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$ISSUE_LABEL" --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | .[].number'); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Resolved: $RUN_URL built and deployed the site."
          done
