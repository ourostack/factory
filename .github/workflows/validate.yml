# Validates every pull request against the published facts schema.
#
# The candidate is untrusted data. This workflow checks out the base, fetches
# the pull request's exact head commit as Git objects only, and runs Desk's
# validator, cloned from ourostack/desk main, on what merging that head into
# the base would land. A data pull request that passes it must also pass the
# store's own plugin-name rule (`.github/scripts/check-intake-plugins.sh`,
# read from the base): every facts file it adds or modifies carries
# `refs.private.plugins` and names only plugins listed in `intake.json`. It
# must also pass the store's own rule on correction records
# (`.github/scripts/check-corrections.mjs`, read from the base): every
# `corrections/*.json` file it adds or modifies parses as JSON and passes
# `validateCorrectionRecord`, and the store's own rule on capture records
# (`.github/scripts/check-capture.sh`, read from the base): every
# `capture/` file it adds or modifies has a valid path, size and key set.
# This file never checks out, installs or
# executes the candidate's files. Failures report stable reason codes only.
#
# These checks are skipped (not failed) when the base checkout does not yet
# have the script: the pull request that first adds a repo-owned check can
# only be judged once it lands. The unit tests under
# `.github/scripts/__tests__/` run from the base the same way, for the same
# reason, and they test the code that judges this pull request.
#
# The pull request's own tests run in a separate job, `head-tests`, which
# `factory-validate` waits for and fails on. It executes the candidate's code,
# so it is the one place that does, and it runs only when it is safe:
#   - A pull request that changes only data (JSON files at any depth under
#     `facts/`, `labels/` and `capture/`, which is everything an intake pull
#     request from a contributor's machine holds, labels included at
#     `labels/<job>/<session>.json`) has no code to run; the job says so and
#     passes. Nothing of the candidate is checked out or executed. Paths are
#     read NUL-delimited, and a path with a control character, or any error in
#     reading or matching, counts as code (fail closed).
#   - A pull request that changes anything else runs its tests only when its
#     author is a maintainer (the same collaborator-permission read as below)
#     and its head branch is in this repository (not a fork, where someone
#     else could push to it). For anyone else the job fails with
#     `head_tests_author_not_maintainer` or `head_tests_head_not_in_repository`,
#     which is also what the validator would say about a change outside the
#     data paths; the candidate's code is never executed.
#   - Correction records and `factory.json` are not data paths here, so a
#     maintainer's pull request that changes only them also runs the suite
#     with Desk required. Ruling: that is accepted on purpose. A drift between
#     the store's copies of Desk's tables and Desk's own should stop these
#     pull requests until it is fixed (andon), not merge past it.
#   - The job has a read-only token and no secrets, as every `pull_request`
#     job here does. The checkout does not persist its credentials, the
#     candidate's code runs in a merged working tree (the head merged into the
#     base, which is what would land) with a scrubbed environment, and no step
#     that holds a token reads or runs anything from the candidate.
# So a green `factory-validate` now also means the pull request's own tests
# passed on what merging it would land. Those tests include the comparisons
# with Desk's tables, which `head-tests` requires (a Desk that cannot be read
# fails them). The base's run above does not look at Desk: a change in Desk
# must not block every intake pull request. A drift is instead raised by the
# `factory-build` run's `issue-checks` job, which opens the build-failing issue.
#
# GitHub runs the workflow files of the pull request's own merge commit on
# `pull_request`, so a pull request that edits this file, or adds a workflow
# with a job named `factory-validate`, runs its own code here instead, with
# a read-only token and no secrets, and can post a green check. A green
# `factory-validate` is therefore not evidence on its own: factory-merge
# validates again from main before it merges, and a maintainer merges
# someone else's pull request only through factory-merge or after running
# validate-pr at its exact head.
#
# A maintainer is the pull request author when their permission on this
# repository is `admin` or `write` (`maintain` reads as `write`), read from
# the collaborator permission API with the read-only workflow token. The
# author association is not used: it depends on whether a member's
# organization membership is public. Any API error means "not a maintainer".
name: factory-validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: factory-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  head-tests:
    name: factory-head-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check out the base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the candidate as data
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "$HEAD_SHA"
          test "$(git rev-parse --verify "$HEAD_SHA^{commit}")" = "$HEAD_SHA"

      - name: Decide whether the candidate has code to run
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          paths="$RUNNER_TEMP/changed-paths"
          if ! git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$paths" 2> /dev/null; then
            printf 'factory-validate: head_tests_unavailable\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Data paths: a JSON file at any depth under facts/, labels/ or capture/.
          # Anything else, a control character in a path, or a matching error is code.
          code=no
          data_path='^(facts|labels|capture)/([^/]+/)*[^/]+\.json$'
          while IFS= read -r -d '' path; do
            case "$path" in
              *[[:cntrl:]]*) code=yes; break ;;
            esac
            # No match (status 1) and a matching error (status 2) are both code.
            if [[ "$path" =~ $data_path ]]; then :; else code=yes; break; fi
          done < "$paths"
          if [ "$code" = no ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "factory-head-tests: the pull request changes only data; there is no candidate code to run"
            exit 0
          fi
          maintainer=no
          if printf '%s' "$AUTHOR" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'; then
            if permission=$(gh api "repos/$REPOSITORY/collaborators/$AUTHOR/permission" --jq '.permission' 2> /dev/null); then
              case "$permission" in
                admin|write) maintainer=yes ;;
              esac
            else
              printf 'factory-validate: maintainer_check_unavailable\n' | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          if [ "$maintainer" != yes ]; then
            printf 'factory-validate: failed\nfactory-rejected: head_tests_author_not_maintainer\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            printf 'factory-validate: failed\nfactory-rejected: head_tests_head_not_in_repository\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "run=yes" >> "$GITHUB_OUTPUT"

      - name: Clone Desk main
        if: steps.scope.outputs.run == 'yes'
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch main https://github.com/ourostack/desk "$RUNNER_TEMP/desk"

      - name: Run the pull request's own tests on what merging it would land
        if: steps.scope.outputs.run == 'yes'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          tree="$RUNNER_TEMP/merged"
          git worktree add --quiet --detach "$tree" "$BASE_SHA"
          if ! git -C "$tree" -c user.name=factory-ci -c user.email=factory-ci@users.noreply.github.com merge --quiet --no-ff --no-edit "$HEAD_SHA" > /dev/null 2>&1; then
            printf 'factory-validate: failed\nfactory-rejected: head_tests_merge_conflict\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ ! -d "$tree/.github/scripts/__tests__" ]; then
            printf 'factory-validate: failed\nfactory-rejected: head_tests_missing\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cd "$tree"
          # A scrubbed environment: no token, no runner secrets, nothing but
          # what the tests need. Tests that need Desk read it from DESK_DIR.
          if ! env -i PATH="$PATH" HOME="$RUNNER_TEMP" CI=true FACTORY_REQUIRE_DESK=1 DESK_DIR="$RUNNER_TEMP/desk" \
            node --test '.github/scripts/__tests__/*.test.mjs'; then
            printf 'factory-validate: failed\nfactory-rejected: head_tests_failed\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  factory-validate:
    name: factory-validate
    needs: head-tests
    # Runs even when head-tests failed, so the check reports a result of its
    # own instead of being skipped; the first step then fails it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the pull request's own tests
        env:
          HEAD_TESTS: ${{ needs.head-tests.result }}
        run: |
          set -uo pipefail
          if [ "$HEAD_TESTS" != success ]; then
            printf 'factory-validate: failed\nfactory-rejected: head_tests_%s\n' "$HEAD_TESTS" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check out the base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the candidate as data
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "$HEAD_SHA"
          test "$(git rev-parse --verify "$HEAD_SHA^{commit}")" = "$HEAD_SHA"

      - name: Run the store's own script tests
        run: |
          set -euo pipefail
          if [ -d .github/scripts/__tests__ ]; then
            node --test '.github/scripts/__tests__/*.test.mjs'
          else
            echo "factory-validate: no .github/scripts/__tests__ on the base yet; skipped"
          fi

      - name: Clone Desk main
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch main https://github.com/ourostack/desk "$RUNNER_TEMP/desk"
          echo "Desk main: $(git -C "$RUNNER_TEMP/desk" rev-parse HEAD)"

      - name: Decide whether the author maintains this repository
        id: maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -uo pipefail
          association=NONE
          if printf '%s' "$AUTHOR" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'; then
            if permission=$(gh api "repos/$REPOSITORY/collaborators/$AUTHOR/permission" --jq '.permission' 2> /dev/null); then
              case "$permission" in
                admin|write) association=COLLABORATOR ;;
              esac
            else
              printf 'factory-validate: maintainer_check_unavailable\n' | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "association=$association" >> "$GITHUB_OUTPUT"
          echo "Maintainer association: $association"

      - name: Validate the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR_ASSOCIATION: ${{ steps.maintainer.outputs.association }}
        run: |
          set -uo pipefail
          result="$RUNNER_TEMP/factory-validate.json"
          node "$RUNNER_TEMP/desk/plugins/desk/mcp/scripts/factory.js" validate-pr \
            --base "$BASE_SHA" --head "$HEAD_SHA" --author-association "$AUTHOR_ASSOCIATION" \
            > "$result" 2> /dev/null || true
          if ! jq -e '(.ok | type) == "boolean"' "$result" > /dev/null 2>&1; then
            printf 'factory-validate: validator_unavailable\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if jq -e '.ok == true' "$result" > /dev/null; then
            # The store's own rule on correction records, from the base, for
            # every pull request (maintenance or not): a corrections/*.json
            # file it adds or modifies must pass validateCorrectionRecord.
            if [ -f .github/scripts/check-corrections.mjs ]; then
              if ! codes=$(node .github/scripts/check-corrections.mjs "$BASE_SHA" "$HEAD_SHA"); then
                printf 'factory-validate: failed\n' | tee -a "$GITHUB_STEP_SUMMARY"
                printf '%s\n' "$codes" | grep -E '^[a-z][a-z0-9_]{0,63}$' | sed 's/^/factory-rejected: /' | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            # The store's own rule on capture records, from the base, for
            # every pull request: a capture/ file it adds or modifies must be
            # capture/<16 hex>.json, at most 2 KiB, with exactly the known
            # keys, and one per pull request.
            if [ -f .github/scripts/check-capture.sh ]; then
              if ! codes=$(bash .github/scripts/check-capture.sh "$BASE_SHA" "$HEAD_SHA"); then
                printf 'factory-validate: failed\n' | tee -a "$GITHUB_STEP_SUMMARY"
                printf '%s\n' "$codes" | grep -E '^[a-z][a-z0-9_]{0,63}$' | sed 's/^/factory-rejected: /' | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            if jq -e '.maintenance == true' "$result" > /dev/null; then
              printf 'factory-validate: passed (maintenance)\n' | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # The store's own rule on plugin names, from the base: newly added
            # or modified facts must come from a client that withholds
            # privately sourced plugin names, and may name only listed public
            # plugins.
            if ! codes=$(bash .github/scripts/check-intake-plugins.sh "$BASE_SHA" "$HEAD_SHA"); then
              printf 'factory-validate: failed\n' | tee -a "$GITHUB_STEP_SUMMARY"
              printf '%s\n' "$codes" | grep -E '^[a-z][a-z0-9_]{0,63}$' | sed 's/^/factory-rejected: /' | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            printf 'factory-validate: passed\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'factory-validate: failed\n' | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '[.errors[].code | if type == "string" and test("^[a-z][a-z0-9_]{0,63}$") then . else "unknown_code" end] | unique[] | "factory-rejected: \(.)"' "$result" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
