# Rebuilds the reports from the facts on main and publishes them on the
# `reports` branch as a single orphan commit.
#
# Runs on pushes to main (maintainer merges), after factory-merge completes
# (merges made with the workflow token do not start push workflows), daily,
# and on demand. The build is deterministic and the commit has fixed metadata,
# so the same facts (and facts history) always produce the same commit and an unchanged build
# pushes nothing. The commit has no parent and holds only the build output.
#
# It also runs when an issue is opened, edited, reopened or labeled, so a new
# or edited kaizen card is checked right away; an issue event skips the
# report build and runs only the issue checks. Changes the build itself makes
# with the workflow token start no new run.
#
# Two jobs keep write access apart. `factory-build` holds `contents: write`
# and no issue access; it reads only facts and labels on main. The second
# job, `issue-checks`, reads issue text anyone can write, so it holds only
# `contents: read` and `issues: write`. It runs the kaizen check: for every
# open issue labeled `kaizen` it compares the card's measure before and after
# the card's version, keeps one comment of its own on the card up to date and
# sets or clears the `confirmed` and `not-confirmed` labels. It never closes
# a card. Card bodies are untrusted data: Desk parses them strictly and
# echoes nothing back but stable codes and validated values; a card that
# fails is reported and the rest are still checked. Then andon runs even if
# the kaizen check failed: for each plugin listed in `factory.json` (a
# maintenance path, so only a maintainer changes it) it compares the latest
# version with enough jobs to the one before it on the quality measures and
# opens, updates, reopens or closes the issues labeled `andon` that this
# workflow opened; it never touches anyone else's issue.
#
# A pull request can name one of its own workflows `factory-merge` and start
# this workflow through `workflow_run`, and anyone can open an issue. That is
# harmless because this workflow reads no event data: it always builds main.
# Keep it that way.
#
# Before either job reads `facts/`, `.github/scripts/apply-corrections.mjs`
# overlays every `corrections/*.json` record onto that job's own checkout's
# facts files, in place. Both `factory-build` and `issue-checks` run it, each
# against its own ephemeral checkout, so the report, the kaizen check and
# andon all see a session a correction record names as corrected even when a
# stale client has republished the polluted version to `main` again since
# the last build: neither checkout is ever pushed anywhere, so the overlay
# only shapes what that job sees, never `main` itself. A malformed
# correction record fails that step loudly instead of silently computing
# from unvalidated or stale data. A record whose facts file is gone (a
# retraction) is moot, not an error: the step reports it and goes on. No step
# after a failed corrections step runs on the data: the kaizen check and the
# build skip, and andon runs only when its own corrections step succeeded.
#
# A job that some facts file on main ever credited keeps a page. After the
# build, `.github/scripts/retired-job-pages.mjs` writes a short fixed page
# at `jobs/<job>.md` for every such job the build made no report for (its
# sessions were re-derived, corrected or withdrawn), so a card linking that
# job ID leads to "no session is credited to this job now" instead of a
# 404. A card whose job ID never appeared in main's facts (no session was
# ever credited to it, or its desk publishes keyed IDs while the card links
# the plain one) still links a missing page: the store cannot know that job.
# The step streams Git objects one file at a time, which is why this job
# checks out main's full history, and it stops the build on a shallow
# checkout, a missing object or a failed Git call rather than quietly
# writing fewer pages. It writes no `.json`, so the rollups and the site
# never count a retired job.
#
# A red run must not wait for someone to look. When `factory-build` or
# `issue-checks` fails on a run that is not an issue event, the `report` job
# opens one issue titled "Factory build needs attention" (label
# `build-failing`) or comments on it if it is already open, and the next run
# in which both jobs succeed closes it. The alarm steps use `continue-on-error`
# and a warning annotation, so a failed `gh` call never turns a green build
# red (which would skip the `pages` deploy); the job result stays success.
# The job only acts on the default branch. The issue names the failing step and
# the run URL and carries no facts or session content. Issue events are left
# out because anyone can trigger them with a card that fails the check.
name: factory-build

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [factory-merge]
    types: [completed]
  issues:
    types: [opened, edited, reopened, labeled]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: factory-build
  cancel-in-progress: false

jobs:
  factory-build:
    name: factory-build
    if: github.event_name != 'issues' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Full history: the retired job pages step reads every facts file main ever held.
          fetch-depth: 0
          persist-credentials: false

      - name: Clone Desk main
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch main https://github.com/ourostack/desk "$RUNNER_TEMP/desk"
          echo "Desk main: $(git -C "$RUNNER_TEMP/desk" rev-parse HEAD)"

      - name: Apply store corrections
        run: |
          set -euo pipefail
          # Git keeps no empty folders, so a store with no facts has none.
          mkdir -p facts
          node .github/scripts/apply-corrections.mjs --store . | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the reports
        run: |
          set -euo pipefail
          echo "Store main: $(git rev-parse HEAD)"
          node "$RUNNER_TEMP/desk/plugins/desk/mcp/scripts/factory.js" build --store . --out _out

      - name: Keep a page for every retired job
        run: |
          set -euo pipefail
          node .github/scripts/retired-job-pages.mjs --store . --out _out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish the reports branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd _out
          git init --quiet --initial-branch=reports
          git add --all
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="1970-01-01T00:00:00Z"
          export GIT_COMMITTER_DATE="1970-01-01T00:00:00Z"
          git -c commit.gpgsign=false commit --quiet --message "Build factory reports"
          built=$(git rev-parse HEAD)
          published=$(git ls-remote "https://github.com/$REPOSITORY" refs/heads/reports | cut -f1)
          echo "Reports commit: $built (tree $(git rev-parse 'HEAD^{tree}'))" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$built" = "$published" ]; then
            echo "Reports unchanged; nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --quiet --force "https://github.com/$REPOSITORY" HEAD:refs/heads/reports
          echo "Published reports: $built" | tee -a "$GITHUB_STEP_SUMMARY"

  issue-checks:
    name: issue-checks
    needs: factory-build
    if: ${{ !cancelled() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Clone Desk main
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch main https://github.com/ourostack/desk "$RUNNER_TEMP/desk"
          echo "Desk main: $(git -C "$RUNNER_TEMP/desk" rev-parse HEAD)"
          mkdir -p facts

      - name: Apply store corrections
        id: corrections
        run: |
          set -euo pipefail
          node .github/scripts/apply-corrections.mjs --store . | tee -a "$GITHUB_STEP_SUMMARY"

      # The store keeps copies of two of Desk's tables (the host flags the site
      # reads, the vocabulary the correction check mirrors). A drift is a
      # failing test here, which opens the build-failing issue; it does not stop
      # the reports, which are already published by the job before this one.
      - name: Compare the store's copies of Desk's tables with Desk's own
        env:
          DESK_DIR: ${{ runner.temp }}/desk
          FACTORY_REQUIRE_DESK: "1"
        run: |
          set -uo pipefail
          node --test .github/scripts/__tests__/session-numbers.test.mjs .github/scripts/__tests__/corrections.test.mjs

      - name: Check the kaizen cards
        if: ${{ !cancelled() && steps.corrections.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          node "$RUNNER_TEMP/desk/plugins/desk/mcp/scripts/factory.js" kaizen-check --store . --repo "$REPOSITORY" > "$RUNNER_TEMP/kaizen.json"
          status=$?
          echo "Kaizen check: $(cat "$RUNNER_TEMP/kaizen.json")" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Pull the andon cord
        if: ${{ !cancelled() && steps.corrections.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          node "$RUNNER_TEMP/desk/plugins/desk/mcp/scripts/factory.js" andon --store . --repo "$REPOSITORY" > "$RUNNER_TEMP/andon.json"
          status=$?
          echo "Andon: $(cat "$RUNNER_TEMP/andon.json")" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

  # One open issue per problem: a failure comments on it, and the next fully
  # green run closes it.
  report:
    name: report
    needs: [factory-build, issue-checks]
    if: ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'issues' && needs.factory-build.result != 'cancelled' && needs.issue-checks.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Only to read this run's step results and to open, comment on and close the one issue.
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Factory build needs attention
      ISSUE_LABEL: build-failing
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report the failed build
        if: needs.factory-build.result == 'failure' || needs.issue-checks.result == 'failure'
        continue-on-error: true
        run: |
          set -euo pipefail
          trap 'echo "::warning::The build alarm step failed; the build result is unchanged."' ERR
          steps="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[] | select(.conclusion == "failure") | .name as $job | .steps[] | select(.conclusion == "failure") | "\($job): \(.name)"] | join(", ")')"
          body="The factory build failed in $RUN_URL at: ${steps:-unknown step}. If the failed step is in factory-build, the public reports and site stay at their last good build until a run succeeds; if only issue-checks failed, the reports were still published and the failure is in the comparison of the store copies of the Desk tables with the Desk originals (a Desk change not mirrored yet), the kaizen check or the andon check. Open the failed step in the run to see why; the next successful run closes this issue."
          gh label create "$ISSUE_LABEL" --repo "$GITHUB_REPOSITORY" --color B60205 --description "The factory build is failing" --force
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$ISSUE_LABEL" --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
          fi

      - name: Close the issue after a green build
        if: needs.factory-build.result == 'success' && needs.issue-checks.result == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          trap 'echo "::warning::The build alarm step failed; the build result is unchanged."' ERR
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$ISSUE_LABEL" --json number,title --jq 'map(select(.title == env.ISSUE_TITLE)) | .[].number'); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Resolved: $RUN_URL built the reports and passed the issue checks."
          done
