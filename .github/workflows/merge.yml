# Merges or rejects intake pull requests after factory-validate completes.
#
# This workflow always runs from main, so a pull request cannot change it.
# It never trusts the triggering run: a pull request's own workflow files run
# on its `pull_request` event and can post a green `factory-validate`, or name
# a workflow `factory-validate`, so the only field of the `workflow_run`
# event used here is `head_sha`, and that head is validated again with Desk
# main, fetched as Git objects only. Keep it that way: never read any other
# event field, and never trust the triggering conclusion alone.
#
# Three steps keep the write token away from candidate data: the first finds
# the open pull requests at that head and their authors' permission; the
# second, which holds no token, runs Desk's validator and then, for a data
# pull request it passes, the store's own plugin-name rule
# (`.github/scripts/check-intake-plugins.sh`, from main: every added or
# modified facts file carries `refs.private.plugins` and names only plugins
# listed in `intake.json`) and its capture-record rule
# (`.github/scripts/check-capture.sh`, from main: a capture/ file has a valid
# path, size and key set, one per pull request); the third acts on the
# results. It merges only when
# both validations pass and the pull request still has that head, and the
# merge call passes that head as `sha`, so GitHub refuses the merge if the
# head moved. It rejects only when the trusted validation fails and the head
# is unchanged, with a comment of `factory-rejected: <code>` lines and nothing
# else. Maintenance pull requests (changes outside the data paths, including
# .github/, by a maintainer) are labeled `maintenance` and left for a
# maintainer, with one exception: a maintenance pull request whose head is
# in this repository (not a fork), whose author maintains it, whose
# factory-validate run passed, and which only adds or modifies correction
# records (`corrections/*.json`, each passing check-corrections.mjs) or
# `factory.json` (passing Desk main's parseStoreConfig) merges on its own,
# at the validated head (`.github/scripts/maintenance-allowlist.mjs`, from
# main). `intake.json`, `capture.json` and `.github/` stay with a maintainer.
# The same changes from anyone else fail validation with `path` and are
# rejected. A maintainer is the pull request author when
# their permission on this repository is `admin` or `write`; any API error
# means "not a maintainer".
name: factory-merge

on:
  workflow_run:
    workflows: [factory-validate]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: factory-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  factory-merge:
    name: factory-merge
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Clone Desk main
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch main https://github.com/ourostack/desk "$RUNNER_TEMP/desk"
          echo "Desk main: $(git -C "$RUNNER_TEMP/desk" rev-parse HEAD)"

      - name: Find the pull requests at the validated head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          summary() { printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          : > "$RUNNER_TEMP/factory-prs.tsv"

          if ! printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            summary "factory-merge: invalid head"
            exit 1
          fi

          # Fork pull requests leave workflow_run.pull_requests empty, so find
          # the open pull requests whose head is the validated commit.
          numbers=$(gh api "repos/$REPOSITORY/pulls?state=open&base=$DEFAULT_BRANCH&per_page=100" --paginate \
            --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number")
          if [ -z "$numbers" ]; then
            summary "factory-merge: no open pull request has head $HEAD_SHA"
            exit 0
          fi

          for number in $numbers; do
            pr=$(gh api "repos/$REPOSITORY/pulls/$number")
            if [ "$(jq -r '.state' <<<"$pr")" != "open" ] || [ "$(jq -r '.head.sha' <<<"$pr")" != "$HEAD_SHA" ]; then
              summary "factory-merge: #$number head moved; skipped"
              continue
            fi
            # A draft or a `hold` label holds a pull request: it never merges
            # while held. A maintainer's held pull request is left untouched;
            # anyone else's is still validated and rejected if it fails.
            held=false
            if jq -e '.draft == true or ([.labels[].name] | index("hold") != null)' <<<"$pr" > /dev/null; then
              held=true
            fi
            # A maintenance pull request is looked at again: it may merge on
            # its own when it is on the allowlist (see the merge step).
            same_repo=false
            if [ "$(jq -r '.head.repo.full_name // ""' <<<"$pr")" = "$REPOSITORY" ]; then
              same_repo=true
            fi
            author=$(jq -r '.user.login' <<<"$pr")
            association=NONE
            if printf '%s' "$author" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'; then
              if permission=$(gh api "repos/$REPOSITORY/collaborators/$author/permission" --jq '.permission' 2> /dev/null); then
                case "$permission" in
                  admin|write) association=COLLABORATOR ;;
                esac
              else
                summary "factory-merge: #$number maintainer_check_unavailable"
              fi
            fi
            if [ "$held" = true ] && [ "$association" = COLLABORATOR ]; then
              summary "factory-merge: #$number is held (draft or labeled hold); left for a maintainer"
              continue
            fi
            printf '%s\t%s\t%s\t%s\n' "$number" "$association" "$same_repo" "$held" >> "$RUNNER_TEMP/factory-prs.tsv"
          done

      - name: Validate with Desk main (no token)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/factory-prs.tsv" ]; then
            exit 0
          fi
          git fetch --quiet --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git fetch --quiet --no-tags origin "$HEAD_SHA"
          test "$(git rev-parse --verify "$HEAD_SHA^{commit}")" = "$HEAD_SHA"
          base_sha=$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")
          while IFS=$'\t' read -r number association same_repo held; do
            node "$RUNNER_TEMP/desk/plugins/desk/mcp/scripts/factory.js" validate-pr \
              --base "$base_sha" --head "$HEAD_SHA" --author-association "$association" \
              > "$RUNNER_TEMP/factory-validate-$number.json" 2> /dev/null || true
            result="$RUNNER_TEMP/factory-validate-$number.json"
            # The store's own plugin-name rule, from main, for a data pull
            # request Desk passed; a failure becomes a rejection with its codes.
            if jq -e '.ok == true and .maintenance != true' "$result" > /dev/null 2>&1; then
              codes=""
              if ! plugin_codes=$(bash .github/scripts/check-intake-plugins.sh "$base_sha" "$HEAD_SHA"); then
                codes+="$plugin_codes"$'\n'
              fi
              # The store's own rule on capture records, from main.
              # A missing script is capture_check_unavailable, never a skip.
              if ! capture_codes=$(bash .github/scripts/check-capture.sh "$base_sha" "$HEAD_SHA"); then
                if printf '%s\n' "$capture_codes" | grep -qE '^[a-z][a-z0-9_]{0,63}$'; then
                  codes+="$capture_codes"$'\n'
                else
                  codes+="capture_check_unavailable"$'\n'
                fi
              fi
              if [ -n "$codes" ]; then
                printf '%s' "$codes" | jq -R -s -c '{ok: false, errors: [split("\n")[] | select(length > 0) | {code: .}]}' > "$result"
              fi
            fi
            # The maintenance allowlist, from main, for a maintenance pull
            # request Desk passed whose head is in this repository and whose
            # author maintains it: only correction records and factory.json,
            # each valid. Its answer (ok or codes) decides the merge step.
            if jq -e '.ok == true and .maintenance == true' "$result" > /dev/null 2>&1 \
              && [ "$association" = COLLABORATOR ] && [ "$same_repo" = true ] \
              && [ -f .github/scripts/maintenance-allowlist.mjs ]; then
              node .github/scripts/maintenance-allowlist.mjs "$base_sha" "$HEAD_SHA" "$RUNNER_TEMP/desk" \
                > "$RUNNER_TEMP/factory-allow-$number.txt" 2> /dev/null || true
            fi
          done < "$RUNNER_TEMP/factory-prs.tsv"

      - name: Merge or reject
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          summary() { printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          unavailable=0
          failed=0
          # A merge call GitHub refuses (a conflict, a moved head) fails that
          # pull request only; the others at this head are still handled, and
          # the step fails at the end so the refusal is seen.
          merge_at_head() {
            if gh api -X PUT "repos/$REPOSITORY/pulls/$1/merge" -f merge_method=merge -f sha="$HEAD_SHA" > /dev/null 2>&1; then
              return 0
            fi
            summary "factory-merge: #$1 merge_refused; left open"
            failed=1
            return 1
          }
          while IFS=$'\t' read -r number association same_repo held; do
            result="$RUNNER_TEMP/factory-validate-$number.json"
            if ! jq -e '(.ok | type) == "boolean"' "$result" > /dev/null 2>&1; then
              summary "factory-merge: #$number validator_unavailable; no action"
              unavailable=1
              continue
            fi

            if jq -e '.ok == true' "$result" > /dev/null; then
              if [ "$held" = true ]; then
                summary "factory-merge: #$number passed but is held (draft or labeled hold); not merged"
                continue
              fi
              if jq -e '.maintenance == true' "$result" > /dev/null; then
                allow="$RUNNER_TEMP/factory-allow-$number.txt"
                if [ "$association" = COLLABORATOR ] && [ "$same_repo" = true ] && [ "$CONCLUSION" = "success" ] \
                  && [ -f "$allow" ] && [ "$(cat "$allow")" = "ok" ]; then
                  # The sha parameter makes GitHub refuse the merge if the head moved.
                  if merge_at_head "$number"; then
                    summary "factory-merge: #$number maintenance on the allowlist; merged at head $HEAD_SHA"
                  fi
                  continue
                fi
                # A label GitHub refuses fails only this pull request.
                if ! gh api -X POST "repos/$REPOSITORY/issues/$number/labels" -f 'labels[]=maintenance' > /dev/null 2>&1; then
                  summary "factory-merge: #$number label_refused"
                  failed=1
                fi
                if [ -s "$allow" ]; then
                  summary "factory-merge: #$number labeled maintenance; left for a maintainer ($(grep -E '^[a-z][a-z0-9_]{0,63}$' "$allow" | tr '\n' ' '))"
                else
                  summary "factory-merge: #$number labeled maintenance; left for a maintainer"
                fi
                continue
              fi
              if [ "$CONCLUSION" != "success" ]; then
                summary "factory-merge: #$number passed revalidation but its validation run failed; no action"
                continue
              fi
              # The sha parameter makes GitHub refuse the merge if the head moved.
              if merge_at_head "$number"; then
                summary "factory-merge: #$number merged at head $HEAD_SHA"
              fi
              continue
            fi

            codes=$(jq -r '[.errors[].code | if type == "string" and test("^[a-z][a-z0-9_]{0,63}$") then . else "unknown_code" end] | unique[] | "factory-rejected: \(.)"' "$result")
            if [ -z "$codes" ]; then
              codes="factory-rejected: unknown_code"
            fi
            current=$(gh api "repos/$REPOSITORY/pulls/$number" --jq '.head.sha')
            if [ "$current" != "$HEAD_SHA" ]; then
              summary "factory-merge: #$number head moved before rejection; skipped"
              continue
            fi
            gh api -X POST "repos/$REPOSITORY/issues/$number/comments" -f body="$codes" > /dev/null
            gh api -X PATCH "repos/$REPOSITORY/pulls/$number" -f state=closed > /dev/null
            summary "factory-merge: #$number rejected and closed"
            summary "$codes"
          done < "$RUNNER_TEMP/factory-prs.tsv"
          if [ "$unavailable" -ne 0 ] || [ "$failed" -ne 0 ]; then
            exit 1
          fi
          exit 0
